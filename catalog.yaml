# reflect-mcp catalog entries — one per secret-binding type.
#
# The single `reflect` tool returns process.argv, process.env, and
# (for HTTP transports) inbound request headers.

- name: Reflect Remote
  shortDescription: Remote MCP server with a Kubernetes-Secret-bound header
  description: |
    Verifies header secretBinding. `X-Reflect-Token` is bound to a
    pre-existing Kubernetes Secret; kubelet projects the value onto the
    nanobot pod's env and nanobot substitutes it into the outbound header.

    Pre-create the Secret before installing:

        kubectl -n <obot-namespace> create secret generic reflect-mcp-creds \
          --from-literal=x_reflect_token='hello-from-the-vault'

    After install, call `reflect` and check `headers["x-reflect-token"]`.
  metadata:
    categories: Developer Tools
    allow-multiple: "true"
  icon: https://avatars.githubusercontent.com/u/4175918?v=4
  repoURL: https://github.com/calvinmclean/mcp-zoo
  runtime: remote
  remoteConfig:
    fixedURL: http://mcp-zoo.default.svc.cluster.local/mcp
    headers:
      - key: X-Reflect-Test
        name: Reflect Test Header (static)
        description: Static header baked into the catalog entry.
        value: hello-from-obot
        required: false
        sensitive: false

      - key: X-Reflect-User
        name: Reflect User Header
        description: User-supplied sensitive header, set at install time.
        required: false
        sensitive: true

      - key: X-Reflect-Token
        name: Reflect Token Header (Kubernetes Secret-bound)
        description: Bound to a pre-existing K8s Secret via secretBinding.
        required: true
        sensitive: true
        secretBinding:
          name: reflect-mcp-creds
          key: x_reflect_token
  toolPreview:
    - name: reflect
      description: Returns argv, env, cwd, pid, transport, and the inbound HTTP request headers.
      params: {}

- name: Reflect NPX (Bound + Templated Args)
  shortDescription: npx MCP server with a Secret-bound env var used in args template
  description: |
    Verifies env secretBinding through to args template expansion.
    `REFLECT_BOUND_TAG` is bound to a K8s Secret; nanobot substitutes it
    into `--reflect-tag=${REFLECT_BOUND_TAG}` at spawn time.

    Pre-create the Secret before installing:

        kubectl -n <obot-namespace> create secret generic reflect-mcp-creds \
          --from-literal=reflect_npx_tag='hello-from-the-vault'

    After install, call `reflect` and check `argv` for `--reflect-tag=hello-from-the-vault`.
  metadata:
    categories: Developer Tools
  icon: https://avatars.githubusercontent.com/u/4175918?v=4
  repoURL: https://github.com/calvinmclean/mcp-zoo
  runtime: npx
  npxConfig:
    package: "@calvinmclean/reflect-mcp"
    args:
      - --transport
      - stdio
      - --reflect-tag=${REFLECT_BOUND_TAG}
      - hello-from-bound-template
  env:
    - key: REFLECT_BOUND_TAG
      name: Reflect Bound Tag (Kubernetes Secret-bound)
      description: Bound to a K8s Secret key; required=true so the pod fails closed if missing.
      required: true
      sensitive: true
      secretBinding:
        name: reflect-mcp-creds
        key: reflect_npx_tag
  toolPreview:
    - name: reflect
      description: Returns argv, env, cwd, pid, transport, and (for HTTP) request headers.
      params: {}

- name: Reflect NPX (Optional Bound Env)
  shortDescription: npx MCP server with an optional Kubernetes-Secret-bound env var
  description: |
    Verifies optional secretBinding (required: false). The pod starts
    whether or not the Secret exists; the env var is simply absent when
    the Secret is missing. Must NOT be referenced in args templates.

    Pre-create the Secret before installing to exercise the happy path:

        kubectl -n <obot-namespace> create secret generic reflect-mcp-creds \
          --from-literal=reflect_opt_bound_tag='hello-from-optional-vault'

    After install, call `reflect` and check `env["REFLECT_OPT_BOUND_TAG"]`.
  metadata:
    categories: Developer Tools
  icon: https://avatars.githubusercontent.com/u/4175918?v=4
  repoURL: https://github.com/calvinmclean/mcp-zoo
  runtime: npx
  npxConfig:
    package: "@calvinmclean/reflect-mcp"
    args:
      - --transport
      - stdio
      - --reflect-tag=optional-bound-env
  env:
    - key: REFLECT_OPT_BOUND_TAG
      name: Reflect Optional Bound Tag (Kubernetes Secret-bound, optional)
      description: Bound to a K8s Secret key; required=false so the pod starts even if the Secret is missing.
      required: false
      sensitive: true
      secretBinding:
        name: reflect-mcp-creds
        key: reflect_opt_bound_tag
  toolPreview:
    - name: reflect
      description: Returns argv, env, cwd, pid, transport, and (for HTTP) request headers.
      params: {}

- name: Reflect NPX (Bound File Mount)
  shortDescription: npx MCP server with a Secret-bound value mounted as a file
  description: |
    Verifies file secretBinding (file: true). The Secret value is written
    to `/files/` and the env var is set to that path instead of the raw value.

    Pre-create the Secret before installing:

        kubectl -n <obot-namespace> create secret generic reflect-mcp-creds \
          --from-literal=reflect_file_mount='hello-from-the-file-vault'

    After install, call `reflect` and check `env["REFLECT_FILE_MOUNT"]`
    (the file path) and `files["REFLECT_FILE_MOUNT"]` (the file content).
  metadata:
    categories: Developer Tools
  icon: https://avatars.githubusercontent.com/u/4175918?v=4
  repoURL: https://github.com/calvinmclean/mcp-zoo
  runtime: npx
  npxConfig:
    package: "@calvinmclean/reflect-mcp"
    args:
      - --transport
      - stdio
      - --reflect-tag=bound-file-mount
  env:
    - key: REFLECT_FILE_MOUNT
      name: Reflect File Mount (Kubernetes Secret-bound, file)
      description: Bound to a K8s Secret key and mounted as a file; env var holds the file path.
      required: true
      sensitive: true
      file: true
      secretBinding:
        name: reflect-mcp-creds
        key: reflect_file_mount
  toolPreview:
    - name: reflect
      description: Returns argv, env, cwd, pid, transport, file-mount contents, and (for HTTP) request headers.
      params: {}

- name: Reflect NPX (Bound Dynamic File Mount)
  shortDescription: npx MCP server with a Secret-bound file that updates without pod restart
  description: |
    Verifies dynamic file secretBinding (file: true, dynamicFile: true).
    Kubelet updates the mounted file in place when the Secret rotates —
    no pod restart required.

    Pre-create the Secret before installing:

        kubectl -n <obot-namespace> create secret generic reflect-mcp-creds \
          --from-literal=reflect_dyn_file='version-1'

    To verify live rotation: update the Secret, reconnect, call `reflect`,
    and confirm `files["REFLECT_DYN_FILE"]` shows the new value while
    the pod age is unchanged.
  metadata:
    categories: Developer Tools
  icon: https://avatars.githubusercontent.com/u/4175918?v=4
  repoURL: https://github.com/calvinmclean/mcp-zoo
  runtime: npx
  npxConfig:
    package: "@calvinmclean/reflect-mcp"
    args:
      - --transport
      - stdio
      - --reflect-tag=bound-dynamic-file-mount
  env:
    - key: REFLECT_DYN_FILE
      name: Reflect Dynamic File Mount (Kubernetes Secret-bound, file + dynamic)
      description: Bound to a K8s Secret key, mounted as a file; kubelet updates the file in place on rotation.
      required: true
      sensitive: true
      file: true
      dynamicFile: true
      secretBinding:
        name: reflect-mcp-creds
        key: reflect_dyn_file
  toolPreview:
    - name: reflect
      description: Returns argv, env, cwd, pid, transport, file-mount contents, and (for HTTP) request headers.
      params: {}

- name: Reflect Remote (Header Prefix Cases)
  shortDescription: Remote MCP server exercising header prefix across static, user-supplied, and bound headers
  description: |
    Verifies `prefix:` behavior across the three header value-source paths.
    Note: `applyPrefix` is skipped for static `value:` headers — the prefix
    is only applied on the credEnv path (user-supplied and Secret-bound).

    Pre-create the Secret before installing:

        kubectl -n <obot-namespace> create secret generic reflect-mcp-creds \
          --from-literal=reflect_prefix_token='ABC123'

    After install, call `reflect` and inspect `headers`. Expected:
      authorization-static: "Bearer hello-from-static"
      authorization-user:   "Bearer <whatever you supplied>"
      authorization-bound:  "Bearer ABC123"
  metadata:
    categories: Developer Tools
    allow-multiple: "true"
  icon: https://avatars.githubusercontent.com/u/4175918?v=4
  repoURL: https://github.com/calvinmclean/mcp-zoo
  runtime: remote
  remoteConfig:
    fixedURL: http://mcp-zoo.default.svc.cluster.local/mcp
    headers:
      - key: Authorization-Static
        name: Authorization (static + prefix)
        description: |
          Static value; applyPrefix is skipped, so the wire value equals value: verbatim.
        value: Bearer hello-from-static
        prefix: "Bearer "
        required: false
        sensitive: false

      - key: Authorization-User
        name: Authorization (user-supplied + prefix)
        description: User-supplied token; applyPrefix prepends "Bearer " at install time.
        prefix: "Bearer "
        required: false
        sensitive: true

      - key: Authorization-Bound
        name: Authorization (Kubernetes Secret-bound + prefix)
        description: Bound to a K8s Secret key; applyPrefix prepends "Bearer " via the credEnv path.
        prefix: "Bearer "
        required: true
        sensitive: true
        secretBinding:
          name: reflect-mcp-creds
          key: reflect_prefix_token
  toolPreview:
    - name: reflect
      description: Returns argv, env, cwd, pid, transport, and the inbound HTTP request headers.
      params: {}
